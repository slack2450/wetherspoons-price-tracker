name: Validate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          wetherspoons-pub-fetcher/package-lock.json
          wetherspoons-menu-fetcher/package-lock.json
          wetherspoons-api/proxy/package-lock.json
          wetherspoons-api/price/package-lock.json
    - name: Build and test every Lambda
      run: ./build.sh
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
    - name: Initialize providers without remote state
      run: terraform init -backend=false
    - run: terraform fmt -check -recursive
    - run: terraform validate
