name: 'Terraform'

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Deployment phase
        required: true
        default: quiesce
        type: choice
        options:
        - quiesce
        - deploy
        - resume
        - recover

permissions:
  contents: read

concurrency:
  group: wetherspoons-production
  cancel-in-progress: false

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v6
    
    - name: Setup Node.js v24
      uses: actions/setup-node@v6
      with:
        node-version: 24
    
    - name: Install dependencies and build
      run: ./build.sh

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Verify collectors are quiescent before deployment
      if: inputs.phase == 'deploy'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      run: scripts/verify-quiescence.sh

    # Save exactly the plan that the next step applies. Quiesce changes only
    # the scheduler; deploy keeps it disabled; resume re-enables it last.
    - name: Terraform Plan
      env:
        DEPLOY_PHASE: ${{ inputs.phase }}
        TF_VAR_aws_access_key: ${{ secrets.aws_access_key }}
        TF_VAR_aws_secret_key: ${{ secrets.aws_secret_key }}
        TF_VAR_cloudflare_api_email: ${{ secrets.cloudflare_api_email }}
        TF_VAR_cloudflare_api_key: ${{ secrets.cloudflare_api_key }}
        TF_VAR_influxdb_write_api_token: ${{ secrets.influxdb_write_api_token }}
        TF_VAR_influxdb_read_api_token: ${{ secrets.influxdb_read_api_token }}
        TF_VAR_influxdb_url: ${{ vars.influxdb_url }}
        TF_VAR_influxdb_org: ${{ vars.influxdb_org }}
        TF_VAR_influxdb_bucket: ${{ vars.influxdb_bucket }}
        TF_VAR_alarm_email: ${{ secrets.alarm_email }}
      run: |
        case "$DEPLOY_PHASE" in
          quiesce)
            terraform plan -input=false -out=tfplan \
              -var collector_schedule_state=DISABLED \
              -target=module.wetherspoons_pub_fetcher.aws_scheduler_schedule.operational_hours
            ;;
          deploy)
            terraform plan -input=false -out=tfplan -var collector_schedule_state=DISABLED
            ;;
          resume)
            terraform plan -input=false -out=tfplan \
              -var collector_schedule_state=ENABLED \
              -target=module.wetherspoons_pub_fetcher.aws_scheduler_schedule.operational_hours
            ;;
          recover)
            # Incident recovery changes only the missing snapshot permission and
            # its alarm copy. The scheduler remains disabled while DLQ records
            # are replayed through the repaired consumer.
            terraform plan -input=false -out=tfplan \
              -var collector_schedule_state=DISABLED \
              -target=module.wetherspoons_menu_fetcher.aws_iam_role_policy.wetherspoons_menu_fetcher_snapshots \
              -target=module.wetherspoons_menu_fetcher.aws_cloudwatch_metric_alarm.menu_record_failures
            ;;
          *)
            echo "Unsupported deployment phase: $DEPLOY_PHASE" >&2
            exit 1
            ;;
        esac

      # On push to "master", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Apply saved Terraform plan
      env:
        TF_VAR_aws_access_key: ${{ secrets.aws_access_key }}
        TF_VAR_aws_secret_key: ${{ secrets.aws_secret_key }}
        TF_VAR_cloudflare_api_email: ${{ secrets.cloudflare_api_email }}
        TF_VAR_cloudflare_api_key: ${{ secrets.cloudflare_api_key }}
        TF_VAR_influxdb_write_api_token: ${{ secrets.influxdb_write_api_token }}
        TF_VAR_influxdb_read_api_token: ${{ secrets.influxdb_read_api_token }}
        TF_VAR_influxdb_url: ${{ vars.influxdb_url }}
        TF_VAR_influxdb_org: ${{ vars.influxdb_org }}
        TF_VAR_influxdb_bucket: ${{ vars.influxdb_bucket }}
        TF_VAR_alarm_email: ${{ secrets.alarm_email }}
      run: terraform apply -auto-approve -input=false tfplan

    - name: Wait for collectors to drain
      if: inputs.phase == 'quiesce'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      run: scripts/verify-quiescence.sh

    - name: Redrive preserved failed menu records
      if: inputs.phase == 'recover'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        AWS_DEFAULT_REGION: eu-west-2
      run: |
        dlq_url="$(aws sqs get-queue-url \
          --queue-name wetherspoons-dead-letter-queue \
          --query QueueUrl --output text)"
        dlq_arn="$(aws sqs get-queue-attributes \
          --queue-url "$dlq_url" \
          --attribute-names QueueArn \
          --query 'Attributes.QueueArn' --output text)"
        visible="$(aws sqs get-queue-attributes \
          --queue-url "$dlq_url" \
          --attribute-names ApproximateNumberOfMessages \
          --query 'Attributes.ApproximateNumberOfMessages' --output text)"

        if [[ "$visible" == "0" ]]; then
          echo "No visible dead-letter records need recovery."
          exit 0
        fi

        echo "Starting managed redrive of $visible preserved records."
        aws sqs start-message-move-task \
          --source-arn "$dlq_arn" \
          --max-number-of-messages-per-second 5

    - name: Smoke-test real deployed API
      if: inputs.phase == 'deploy'
      run: DIRECT_API_BASE="$(terraform output -raw execute_api_endpoint)" node scripts/smoke-deployed-api.mjs
