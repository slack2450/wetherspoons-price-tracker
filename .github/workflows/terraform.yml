name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wetherspoons-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      TF_VAR_aws_access_key: ${{ secrets.aws_access_key }}
      TF_VAR_aws_secret_key: ${{ secrets.aws_secret_key }}
      TF_VAR_cloudflare_api_email: ${{ secrets.cloudflare_api_email }}
      TF_VAR_cloudflare_api_key: ${{ secrets.cloudflare_api_key }}
      TF_VAR_influxdb_write_api_token: ${{ secrets.influxdb_write_api_token }}
      TF_VAR_influxdb_read_api_token: ${{ secrets.influxdb_read_api_token }}
      TF_VAR_influxdb_url: ${{ vars.influxdb_url }}
      TF_VAR_influxdb_org: ${{ vars.influxdb_org }}
      TF_VAR_influxdb_bucket: ${{ vars.influxdb_bucket }}
      TF_VAR_alarm_email: ${{ secrets.alarm_email }}
      TF_VAR_collector_schedule_state: 'DISABLED'
      TF_VAR_pub_fetcher_reserved_concurrency: '0'

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node.js v24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Build and test every Lambda
      run: ./build.sh

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Initialize and validate Terraform
      run: |
        terraform init
        terraform fmt -check -recursive
        terraform validate

    - name: Pause new publisher invocations
      id: pause_publisher
      run: |
        aws lambda put-function-concurrency \
          --region eu-west-2 \
          --function-name wetherspoons-pub-fetcher \
          --reserved-concurrent-executions 0

    - name: Disable collector schedule
      run: |
        terraform plan -input=false -out=quiesce.tfplan \
          -target=module.wetherspoons_pub_fetcher.aws_scheduler_schedule.operational_hours
        terraform apply -auto-approve -input=false quiesce.tfplan

    - name: Wait for the old collectors to become quiescent
      env:
        QUIESCENCE_PUBLISHER_WAIT_SECONDS: 125
      run: scripts/verify-quiescence.sh

    - name: Plan complete deployment while publisher is paused
      run: terraform plan -input=false -out=deploy.tfplan

    - name: Apply exact deployment plan
      run: terraform apply -auto-approve -input=false deploy.tfplan

    - name: Release publisher on the new code
      run: |
        aws lambda delete-function-concurrency \
          --region eu-west-2 \
          --function-name wetherspoons-pub-fetcher

    - name: Drain any deferred publisher invocation
      env:
        QUIESCENCE_PUBLISHER_WAIT_SECONDS: 0
      run: scripts/verify-quiescence.sh

    - name: Smoke-test real Influx collector
      run: scripts/smoke-collector.sh

    - name: Smoke-test real deployed API
      run: DIRECT_API_BASE="$(terraform output -raw execute_api_endpoint)" node scripts/smoke-deployed-api.mjs

    - name: Re-enable collector schedule only after successful smokes
      env:
        TF_VAR_collector_schedule_state: 'ENABLED'
        TF_VAR_pub_fetcher_reserved_concurrency: '-1'
      run: |
        terraform plan -input=false -out=resume.tfplan \
          -target=module.wetherspoons_pub_fetcher.aws_scheduler_schedule.operational_hours
        terraform apply -auto-approve -input=false resume.tfplan
        test "$(aws scheduler get-schedule \
          --region eu-west-2 \
          --name wetherspoons-operational-hours \
          --query State \
          --output text)" = "ENABLED"

    - name: Leave a failed deployment safely paused
      if: ${{ failure() && steps.pause_publisher.outcome == 'success' }}
      run: |
        schedule_state="$(aws scheduler get-schedule \
          --region eu-west-2 \
          --name wetherspoons-operational-hours \
          --query State \
          --output text 2>/dev/null || true)"
        if [[ "$schedule_state" == "ENABLED" ]]; then
          aws lambda delete-function-concurrency \
            --region eu-west-2 \
            --function-name wetherspoons-pub-fetcher
        else
          aws lambda put-function-concurrency \
            --region eu-west-2 \
            --function-name wetherspoons-pub-fetcher \
            --reserved-concurrent-executions 0
        fi
