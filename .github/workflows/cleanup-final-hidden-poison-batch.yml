name: Cleanup final hidden poison batch

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PURGE_FINAL_791_POISON_MESSAGES to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: inputs.confirmation == 'PURGE_FINAL_791_POISON_MESSAGES'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.aws_access_key }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_key }}
      AWS_DEFAULT_REGION: eu-west-2
      DLQ_URL: https://sqs.eu-west-2.amazonaws.com/729049610945/wetherspoons-dead-letter-queue

    steps:
      - name: Require exactly the final poison batch
        run: |
          count="$(aws sqs get-queue-attributes \
            --queue-url "$DLQ_URL" \
            --attribute-names ApproximateNumberOfMessages \
            --query 'Attributes.ApproximateNumberOfMessages' \
            --output text)"
          echo "Visible messages: $count"
          test "$count" = "791"

      - name: Purge final poison batch
        run: aws sqs purge-queue --queue-url "$DLQ_URL"
